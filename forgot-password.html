<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · WUB BloodCare</title>
  <meta name="description" content="Reset your WUB BloodCare account password.">
  <link rel="icon" type="image/png" href="assets/WUB-Logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="auth-page-wrapper">
    <div class="auth-split-card">

      <!-- LEFT VISUAL BRAND SIDE -->
      <div class="auth-visual-side">
        <div class="auth-visual-brand">
          <div style="margin-bottom: 8px;">
            <img src="assets/WUB-Logo.png" alt="World University of Bangladesh Logo"
              style="width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));">
          </div>
          <h2>WUB Blood<span class="text-accent-red">Care</span></h2>
          <span>Students Helping Students.</span>
        </div>

        <div class="auth-campus-preview">
          <img src="assets/campus-bg.png" alt="WUB Campus Building">
        </div>

        <div class="auth-visual-footer">
          <b>World University of Bangladesh</b>
          <div class="uni-motto-cursive" style="font-size: 13px;">Together We Learn, Together We Grow</div>
        </div>
      </div>

      <!-- RIGHT FORM SIDE -->
      <div class="auth-form-side">
        <a href="index.html" class="mobile-auth-brand">
          <img src="assets/WUB-Logo.png" alt="WUB Logo">
          <span>WUB Blood<span class="text-accent-red">Care</span></span>
        </a>
        <h2>Forgot Password?</h2>
        <p>Enter your WUB Student ID or institutional email to receive reset instructions.</p>

        <div id="resetNoticeBox"
          style="padding: 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 16px; display: none;"></div>

        <form id="forgotForm" onsubmit="handleForgotPassword(event)">
          <div class="form-group-full">
            <label for="resetIdentifier">WUB Student ID / University Email</label>
            <input type="text" id="resetIdentifier" class="form-input"
              placeholder="e.g. WUB-2023-0452 or student@wub.edu.bd" required>
          </div>

          <button type="submit" id="btnResetSubmit" class="btn btn-primary btn-block"
            style="padding: 10px 20px; font-size: 13.5px; margin-top: 14px;">
            Send Reset Instructions
          </button>

          <div style="text-align: center; margin-top: 20px; font-size: 12.5px;">
            <a href="login.html" style="color: var(--primary); font-weight: 600;">← Back to Login</a>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
  <script>
    async function handleForgotPassword(e) {
      e.preventDefault();
      const identifier = document.getElementById('resetIdentifier').value.trim();
      const btn = document.getElementById('btnResetSubmit');
      const box = document.getElementById('resetNoticeBox');

      btn.disabled = true;
      btn.textContent = 'Verifying account...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.textContent = 'Send Reset Instructions';

        box.style.display = 'block';
        box.style.background = '#ECFDF5';
        box.style.color = '#065F46';
        box.style.border = '1px solid #A7F3D0';
        box.innerHTML = `✔ ${data.message}`;
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Instructions';
        box.style.display = 'block';
        box.style.background = '#FEF2F2';
        box.style.color = '#991B1B';
        box.innerHTML = 'Unable to dispatch reset request. Please contact WUB Health Center.';
      }
    }
  </script>
</body>

</html>
