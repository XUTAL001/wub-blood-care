<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · WUB BloodCare</title>
  <meta name="description" content="Sign in to your WUB BloodCare account.">
  <link rel="icon" type="image/png" href="assets/WUB-Logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-page-wrapper">

    <!-- EXACT MATCH FOR BOTTOM RIGHT MOCKUP SCREEN -->
    <div class="auth-split-card">

      <!-- LEFT VISUAL BRAND SIDE -->
      <div class="auth-visual-side">
        <div class="auth-visual-brand">
          <div style="margin-bottom: 8px;">
            <img src="assets/WUB-Logo.png" alt="World University of Bangladesh Logo"
              style="width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));">
          </div>
          <h2>WUB BloodCare</h2>
          <span>Students Helping Students.</span>
        </div>

        <div class="auth-campus-preview">
          <img src="assets/campus-bg.png" alt="WUB Campus Building">
        </div>

        <div class="auth-visual-footer">
          <b>World University of Bangladesh</b>
          <div class="uni-motto-cursive" style="font-size: 13px;">Together We Learn, Together We Grow</div>
        </div>
      </div>

      <!-- RIGHT LOGIN FORM SIDE -->
      <div class="auth-form-side">
        <a href="index.html" class="mobile-auth-brand">
          <img src="assets/WUB-Logo.png" alt="WUB Logo">
          <span>WUB BloodCare</span>
        </a>
        <h2>Welcome Back</h2>
        <p>Login to your WUB BloodCare account.</p>

        <form onsubmit="loginUser(event)">
          <div class="form-group-full">
            <label for="loginId">Student ID / Username</label>
            <input type="text" id="loginId" class="form-input" placeholder="Enter student ID or username" required>
          </div>

          <div class="form-group-full">
            <label for="loginPassword">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required
                style="padding-right: 36px;">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword')"
                aria-label="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block"
            style="padding: 10px 20px; font-size: 13.5px; margin-top: 8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Login
          </button>



          <div style="text-align: center; margin-top: 16px; font-size: 12px;">
            <span style="color: var(--text-muted);">Don't have an account?</span>
            <a href="register.html" style="color: var(--primary); font-weight: 700; margin-left: 4px;">Register</a>
          </div>

          <div style="text-align: center; margin-top: 6px; font-size: 11.5px;">
            <a href="forgot-password.html" style="color: var(--primary); font-weight: 600;">Forgot Password?</a>
          </div>

          <div style="text-align: center; margin-top: 14px;">
            <a href="index.html"
              style="font-size: 11.5px; color: var(--primary); display: inline-flex; align-items: center; gap: 4px;">
              ← Back to Home
            </a>
          </div>
        </form>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
