<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · WUB Blood</title>
  <meta name="description" content="Sign in to your World University of Bangladesh WUB Blood account.">
  <link rel="icon" type="image/png" href="assets/WUB-Logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background: #F8FAFC;">
  
  <div class="auth-page-wrapper">
    
    <!-- EXACT MATCH FOR BOTTOM RIGHT MOCKUP SCREEN -->
    <div class="auth-split-card">
      
      <!-- LEFT VISUAL BRAND SIDE -->
      <div class="auth-visual-side">
        <div class="auth-visual-brand">
          <div class="auth-logo-badge">
            <img src="assets/WUB-Logo.png" alt="WUB Blood Logo" class="auth-logo-img">
            <span class="blood-drop-badge" title="WUB Blood">
              <svg viewBox="0 0 32 38" fill="none">
                <path d="M16 2C16 2 2 16.5 2 24C2 31.732 8.268 38 16 38C23.732 38 30 31.732 30 24C30 16.5 16 2 16 2Z" fill="#EF4444"/>
                <circle cx="16" cy="23" r="4" fill="#FFFFFF" fill-opacity="0.95"/>
              </svg>
            </span>
          </div>
          <h2>WUB BLOOD</h2>
          <span>Student Blood Donation Platform</span>
        </div>

        <div class="auth-campus-preview">
          <img src="assets/campus-bg.png" alt="WUB Campus">
        </div>

        <div class="auth-visual-footer">
          <b>World University of Bangladesh</b>
          <small>Together We Learn, Together We Grow</small>
        </div>
      </div>

      <!-- RIGHT LOGIN FORM SIDE -->
      <div class="auth-form-side">
        <h2>Welcome Back</h2>
        <p>Login to your WUB Blood account.</p>

        <form onsubmit="loginUser(event)">
          <div class="form-group-full">
            <label for="loginId">Student ID / Username</label>
            <input type="text" id="loginId" class="form-input" placeholder="Enter student ID or username" required>
          </div>

          <div class="form-group-full">
            <label for="loginPassword">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required style="padding-right: 36px;">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword')" aria-label="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="padding: 10px 20px; font-size: 13.5px; margin-top: 8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Login
          </button>

          <!-- 1-Click Demo Login for all 4 RBAC Roles -->
          <div style="margin-top: 14px; padding: 10px; background: var(--surface-alt); border-radius: 8px; font-size: 11px; text-align: center;">
            <span style="color: var(--text-muted); font-weight: 600;">⚡ Quick Role Switcher (Demo):</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;">
              <button type="button" class="btn btn-outline btn-sm" onclick="quickFillLogin('student')">👤 Student</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="quickFillLogin('moderator')">🛡️ Moderator</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="quickFillLogin('admin')">⚙️ Admin</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="quickFillLogin('super_admin')">👑 Super Admin</button>
            </div>
          </div>

          <div style="text-align: center; margin-top: 16px; font-size: 12px;">
            <span style="color: var(--text-muted);">Don't have an account?</span>
            <a href="register.html" style="color: var(--primary); font-weight: 700; margin-left: 4px;">Register</a>
          </div>

          <div style="text-align: center; margin-top: 6px; font-size: 11.5px;">
            <a href="javascript:void(0)" onclick="showToast('Password reset link sent to your registered WUB institutional email.', 'success')" style="color: var(--text-muted);">Forgot Password?</a>
          </div>

          <div style="text-align: center; margin-top: 14px;">
            <a href="index.html" style="font-size: 11.5px; color: var(--primary); display: inline-flex; align-items: center; gap: 4px;">
              ← Back to Home
            </a>
          </div>
        </form>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
