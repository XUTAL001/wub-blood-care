<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · WUB BloodCare</title>
  <meta name="description" content="Create a verified student account on WUB BloodCare platform.">
  <link rel="icon" type="image/png" href="assets/WUB-Logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-page-wrapper">

    <div class="auth-split-card">

      <!-- LEFT VISUAL BRAND SIDE -->
      <div class="auth-visual-side">
        <div class="auth-visual-brand">
          <div style="margin-bottom: 8px;">
            <img src="assets/WUB-Logo.png" alt="World University of Bangladesh Logo"
              style="width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));">
          </div>
          <h2>WUB Blood<span class="text-accent-red">Care</span></h2>
          <span>Students Helping Students.</span>
        </div>

        <div class="auth-campus-preview">
          <img src="assets/campus-bg.png" alt="WUB Campus Building">
        </div>

        <div class="auth-visual-footer">
          <b>World University of Bangladesh</b>
          <div class="uni-motto-cursive" style="font-size: 13px;">Together We Learn, Together We Grow</div>
        </div>
      </div>

      <!-- RIGHT REGISTRATION FORM SIDE -->
      <div class="auth-form-side">
        <a href="index.html" class="mobile-auth-brand">
          <img src="assets/WUB-Logo.png" alt="WUB Logo">
          <span>WUB Blood<span class="text-accent-red">Care</span></span>
        </a>
        <h2>Create Account</h2>
        <p>Join the verified WUB BloodCare student network.</p>

        <form onsubmit="registerAccount(event)">
          <div class="form-group-full">
            <label for="regName">Full Name *</label>
            <input type="text" id="regName" class="form-input" placeholder="Tanvir Alam" required>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="regId">Student ID *</label>
              <input type="text" id="regId" class="form-input" placeholder="WUB-2023-0842" required>
            </div>

            <div class="form-group">
              <label for="regBlood">Blood Group *</label>
              <select id="regBlood" class="form-select" required>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+" selected>O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>
          </div>

          <div class="form-group-full">
            <label for="regEmail">WUB Institutional Email *</label>
            <input type="email" id="regEmail" class="form-input" placeholder="student@wub.edu.bd" required>
          </div>

          <div class="form-group-full">
            <label for="regDept">Department *</label>
            <select id="regDept" class="form-select" required>
              <option value="Computer Science &amp; Engineering (CSE)">Computer Science &amp; Engineering (CSE)</option>
              <option value="Electrical &amp; Electronic Engineering (EEE)">Electrical &amp; Electronic Engineering
                (EEE)</option>
              <option value="Business Administration (BBA)">Business Administration (BBA)</option>
              <option value="English (ENG)">English (ENG)</option>
              <option value="Pharmacy">Pharmacy</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Law">Law</option>
              <option value="Public Health">Public Health</option>
            </select>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="regPhone">Mobile Phone *</label>
              <input type="tel" id="regPhone" class="form-input" placeholder="01712345678" required>
            </div>
            <div class="form-group">
              <label for="regAddress">Dhaka Area *</label>
              <select id="regAddress" class="form-select" required data-populate="locations">
                <option value="">Select location / area</option>
                <option value="Agargaon">Agargaon</option>
                <option value="Badda">Badda</option>
                <option value="Banani">Banani</option>
                <option value="Bashundhara">Bashundhara</option>
                <option value="Dhanmondi">Dhanmondi</option>
                <option value="Farmgate">Farmgate</option>
                <option value="Gulshan">Gulshan</option>
                <option value="Jatrabari">Jatrabari</option>
                <option value="Khilkhet">Khilkhet</option>
                <option value="Mirpur">Mirpur</option>
                <option value="Mohakhali">Mohakhali</option>
                <option value="Mohammadpur">Mohammadpur</option>
                <option value="Motijheel">Motijheel</option>
                <option value="Old Dhaka (Puran Dhaka)">Old Dhaka (Puran Dhaka)</option>
                <option value="Rampura">Rampura</option>
                <option value="Shahbagh / DMCH">Shahbagh / DMCH</option>
                <option value="Tejgaon">Tejgaon</option>
                <option value="Uttara">Uttara</option>
                <option value="WUB Permanent Campus (Uttara)">WUB Permanent Campus (Uttara)</option>
              </select>
            </div>
          </div>

          <div class="form-group-full">
            <label for="regPassword">Password *</label>
            <div class="password-input-wrap">
              <input type="password" id="regPassword" class="form-input"
                placeholder="Create secure password (min 6 chars)" required style="padding-right: 36px;">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword')"
                aria-label="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block"
            style="padding: 10px 20px; font-size: 13.5px; margin-top: 8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <polyline points="16 11 18 13 22 9" />
            </svg>
            Create Account
          </button>

          <div style="text-align: center; margin-top: 16px; font-size: 12px;">
            <span style="color: var(--text-muted);">Already registered?</span>
            <a href="login.html" style="color: var(--primary); font-weight: 700; margin-left: 4px;">Login</a>
          </div>

          <div style="text-align: center; margin-top: 12px;">
            <a href="index.html"
              style="font-size: 11.5px; color: var(--primary); display: inline-flex; align-items: center; gap: 4px;">
              ← Back to Home
            </a>
          </div>
        </form>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
