services:
  - type: web
    name: wub-blood-care-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://tanviralamshifat.me
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DBNAME
        value: wub_bloodcare
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
