<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WUB Blood Automated Test Suite</title>
</head>
<body>
  <div id="testOutput">Running tests...</div>
  <script src="script.js"></script>
  <script>
    const results = [];
    function assert(name, condition) {
      if (condition) {
        results.push({ test: name, status: "PASS" });
        console.log("PASS: " + name);
      } else {
        results.push({ test: name, status: "FAIL" });
        console.error("FAIL: " + name);
      }
    }

    try {
      // 1. Data Store Initialization
      const users = getStoredUsers();
      const donors = getStoredDonors();
      const reqs = getStoredRequests();
      const notifs = getStoredNotifications();
      const logs = getStoredAuditLogs();

      assert("Seed users populated", users && users.length >= 6);
      assert("Seed donors populated", donors && donors.length >= 10);
      assert("Seed blood requests populated", reqs && reqs.length >= 3);
      assert("Seed notifications populated", notifs && notifs.length >= 1);
      assert("Seed audit logs populated", logs && logs.length >= 1);

      // 2. Authentication & Session
      setCurrentUser(null);
      assert("Logout clears user session", getCurrentUser() === null);

      // Test Student Login
      const studentUser = users.find(u => u.role === "student");
      setCurrentUser(studentUser);
      assert("Student login sets active user", getCurrentUser() && getCurrentUser().role === "student");
      assert("Student does not have admin permissions", hasRole("admin") === false);
      assert("Student does not have moderator permissions", hasRole("moderator") === false);

      // Test Moderator Login
      const modUser = users.find(u => u.role === "moderator");
      setCurrentUser(modUser);
      assert("Moderator has moderator permission", hasRole("moderator") === true);
      assert("Moderator does NOT have admin permission", hasRole("admin") === false);
      assert("Moderator does NOT have super_admin permission", hasRole("super_admin") === false);

      // Test Admin Login
      const adminUser = users.find(u => u.role === "admin");
      setCurrentUser(adminUser);
      assert("Admin has admin permission", hasRole("admin") === true);
      assert("Admin has moderator permission", hasRole("moderator") === true);
      assert("Admin does NOT have super_admin permission", hasRole("super_admin") === false);

      // Test Super Admin Login
      const superAdminUser = users.find(u => u.role === "super_admin");
      setCurrentUser(superAdminUser);
      assert("Super Admin has super_admin permission", hasRole("super_admin") === true);
      assert("Super Admin has admin permission", hasRole("admin") === true);
      assert("Super Admin has moderator permission", hasRole("moderator") === true);

      // 3. Validation Helpers
      assert("BD Phone Validator accepts valid 01712345678", isValidBDPhone("01712345678") === true);
      assert("BD Phone Validator accepts valid 01812345678", isValidBDPhone("01812345678") === true);
      assert("BD Phone Validator accepts valid 01912345678", isValidBDPhone("01912345678") === true);
      assert("BD Phone Validator rejects short 0171234", isValidBDPhone("0171234") === false);
      assert("BD Phone Validator rejects invalid prefix 01212345678", isValidBDPhone("01212345678") === false);
      assert("BD Phone Validator rejects letters", isValidBDPhone("0171234567A") === false);

      // 4. Blood Compatibility Matrix
      assert("Blood Compatibility lookup for B+", BLOOD_COMPATIBILITY["B+"] && BLOOD_COMPATIBILITY["B+"].donateTo.includes("AB+"));
      assert("Blood Compatibility lookup for O-", BLOOD_COMPATIBILITY["O-"] && BLOOD_COMPATIBILITY["O-"].donateTo.includes("All Blood Groups"));
      assert("Blood Compatibility lookup for AB+", BLOOD_COMPATIBILITY["AB+"] && BLOOD_COMPATIBILITY["AB+"].receiveFrom.includes("All Blood Groups"));

      // 5. Donor Verification Lifecycle
      const pendingDonor = donors.find(d => d.verificationStatus === "pending");
      assert("Initial pending donors exist in queue", !!pendingDonor);

      if (pendingDonor) {
        // Find Blood should NOT include unverified/pending donors
        const verifiedDonors = getStoredDonors().filter(d => d.verificationStatus === "verified");
        assert("Pending donor is not in verified list", !verifiedDonors.some(d => d.id === pendingDonor.id));

        // Super Admin verifies donor
        adminVerifyDonor(pendingDonor.id);
        const updatedDonors = getStoredDonors();
        const verifiedTarget = updatedDonors.find(d => d.id === pendingDonor.id);
        assert("Donor status updated to verified", verifiedTarget && verifiedTarget.verificationStatus === "verified");
      }

      // 6. Blood Request Lifecycle
      const pendingReq = reqs.find(r => r.status === "Pending");
      assert("Initial pending request exists", !!pendingReq);
      if (pendingReq) {
        adminUpdateRequestStatus(pendingReq.id, "Approved");
        const updatedReqs = getStoredRequests();
        const approvedReq = updatedReqs.find(r => r.id === pendingReq.id);
        assert("Request status transitioned to Approved", approvedReq && approvedReq.status === "Approved");
      }

      // 7. Super Admin RBAC protection test
      setCurrentUser(modUser); // as moderator
      const targetUser = users.find(u => u.role === "student");
      adminChangeUserRole(targetUser.id, "admin");
      // Target role should NOT have changed because moderator lacks super_admin
      const refreshedUsers = getStoredUsers();
      const unchangedTarget = refreshedUsers.find(u => u.id === targetUser.id);
      assert("Moderator cannot elevate user role", unchangedTarget.role === "student");

      setCurrentUser(superAdminUser); // as super_admin
      adminChangeUserRole(targetUser.id, "moderator");
      const updatedUserRoles = getStoredUsers();
      const changedTarget = updatedUserRoles.find(u => u.id === targetUser.id);
      assert("Super Admin can change user role", changedTarget.role === "moderator");

      document.getElementById("testOutput").innerHTML = "<h3>Test Results:</h3>" + 
        results.map(r => `<div>[${r.status}] ${r.test}</div>`).join("") +
        `<div id="testSummary">TOTAL: ${results.length}, PASS: ${results.filter(r=>r.status==="PASS").length}, FAIL: ${results.filter(r=>r.status==="FAIL").length}</div>`;

    } catch (err) {
      console.error("Test execution error:", err);
      document.getElementById("testOutput").innerHTML = "<h3 style='color:red;'>TEST CRASH: " + err.message + "</h3>";
    }
  </script>
</body>
</html>
